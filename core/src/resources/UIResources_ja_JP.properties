BMSIR_RULE_PROFILE=判定・ゲージ
TAB_BMSIR_SPECIFIC=BMS-IR固有設定
BMSIR_ARENA_LANGUAGE=本体UI言語
BMSIR_ARENA_LANGUAGE_DESCRIPTION=Arenaオーバーレイ、フェーズ表示、F2のMANIAC OPTIONS、Ctrl+Shift+F5配下の本体組み込み画面を日本語／英語へ切り替えます。BMS-IR起動前設定は起動前コンフィグの言語に従います。全画面への反映には本体を再起動してください。
BMSIR_ONE_BASS_ENABLED=START＋1鍵による正規1鍵固定を有効にする
BMSIR_ONE_BASS_DESCRIPTION=通常RANDOMで曲決定時にSTARTと任意の1鍵を押すと、正規譜面の1鍵レーンをその鍵盤へ固定します。残りのレーンは同じseedの通常RANDOM配置です。
BMSIR_START_HERE_PREVIEW_ENABLED=譜面読込中・READY中に初手ノーツを表示する
BMSIR_START_HERE_PREVIEW_DESCRIPTION=最初に発音する同時押しを、使用中スキンのノーツ画像でレーン上端またはSUD+直下へ表示します。
BMSIR_DAN_LOCAL_SYNC_ENABLED=BMS-IR段位をローカル同期する
BMSIR_DAN_LOCAL_SYNC_DESCRIPTION=Primary IRの表取得成功時に、BMS-IRの段位コースを現在のプレイヤーへ保存します。通信失敗時は前回の正常取得分を残し、個人作成コースは上書きしません。
BMSIR_START_BUTTON_ACTION=選曲画面のSTART短押し
BMSIR_START_BUTTON_ACTION_DESCRIPTION=START短押しの動作を選びます。350ms以上の長押しでプレイOPを開きます。START＋鍵盤とSTART＋SELECTの従来操作は維持されます。
BMSIR_SELECT_BUTTON_ACTION=選曲画面のSELECT短押し
BMSIR_SELECT_BUTTON_ACTION_DESCRIPTION=SELECT短押しの動作を選びます。350ms以上の長押しでアシストOPを開きます。START＋SELECTの詳細OPは変わりません。
BMSIR_SELECT_DIFFICULTY_DISPLAY=難易度変更時の表示方式
BMSIR_SELECT_DIFFICULTY_DISPLAY_DESCRIPTION=個別表示は各譜面を別々に表示し、選択中の同曲難易度にだけカーソルを移動します。LR2式は同曲譜面を1曲にまとめ、現在の一覧にある全曲へ共通の難易度段階を適用します。
BMSIR_SELECT_KEY_MODES=表示・切り替え対象の鍵盤モード
BMSIR_SELECT_KEY_MODES_DESCRIPTION=チェックを外した鍵盤数は選曲画面全体で非表示になります。チェックした鍵盤数は最上位・フォルダ・曲のどこでも既定順で短押し切り替えできます。ALLは混在表示を巡回に加え、ALLだけなら全鍵盤数を維持します。すべて外した場合は7Kを有効に戻します。
BMSIR_HIDE_MISSING_TABLE_SONGS=全難易度表で未所持曲を隠す
BMSIR_HIDE_MISSING_TABLE_SONGS_DESCRIPTION=すべての難易度表へ共通で適用します。HTTPダウンロードが有効でも表内の未所持曲を隠し、通常フォルダ・検索・Arena候補の表示は変更しません。
BMSIR_ARENA_TARGET_MODE=Arena本体ターゲット
BMSIR_ARENA_TARGET_MODE_DESCRIPTION=Arena中、選択した対戦相手のライブEXを本体スキンのTARGET SCOREへ反映します。指定プレイヤーは試合中だけゲーム内オーバーレイで選択します。
BMSIR_ARENA_GRAPH_ORDER=Arenaスコアグラフの並び
BMSIR_ARENA_GRAPH_ORDER_DESCRIPTION=順位順は現在のスコア順位に合わせます。入室順固定は列とプレイヤー色を試合中固定します。
BMSIR_COVER_CONTROL_MODE=START＋6／7鍵の動作
BMSIR_COVER_CONTROL_MODE_DESCRIPTION=従来のハイスピード操作、LR2式SUD+操作、SUD+／HIDDEN／LIFT対応の拡張操作から選択します。カバー変更は1押下につき1回です。
BMSIR_COVER_CHANGE_STEP=カバー変更幅（1～1000）
BMSIR_COVER_HISPEED_AUTO_ADJUST_ENABLED=START＋6／7のカバー変更時にFHSを再計算する
BMSIR_JUDGE_RANK_SORT_ENABLED=選曲ソートに判定難易度を追加する
BMSIR_JUDGE_RANK_SORT_SKIN_NOTICE_ENABLED=判定難易度ソート選択時に未対応スキン向け通知を表示する
BMSIR_JUDGE_RANK_SORT_DESCRIPTION=従来の8種類に判定難易度ソートを追加します。未対応スキンでは正常に表示されない場合があります。
BMSIR_NUMPAD_SHORTCUTS=物理テンキーのショートカット
BMSIR_NUMPAD_SHORTCUTS_DESCRIPTION=NUMPAD 0～9へ個別に動作を割り当てます。同じ動作の重複割り当ても可能です。長押しによる連続実行はありません。
BMSIR_NUMPAD_JUDGE_TIMING_STEP=判定タイミング変更幅
BMSIR_JUDGE_TIMING_RESTORE_ENABLED=AUTO有効で開始した曲の終了後に判定タイミングを戻す
BMSIR_INFO_NOTIFICATIONS_ENABLED=一時的なINFO通知を表示する
BMSIR_EXPORT_VANILLA_SCORE_DB=通常oraja向けスコアDBを生成
BMSIR_EXPORT_VANILLA_SCORE_DB_DESCRIPTION=通常成績だけを含むscore-vanilla-日時.dbを新規作成します。元DBは上書きせず、MANIAC成績は除外し、両DBの整合性を確認します。
BMSIR_LONG_NOTE_FIXED=全ロングノートをLONG NOTEとして扱う（常時ON）
BMSIR_LONG_NOTE_FIXED_DESCRIPTION=BMS-IRはCN/HCNのスコアを受け付けないため、譜面ノーツ数と送信スコアの互換性を守る固定ルールです。
