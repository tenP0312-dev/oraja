<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BMS-IR Random Pattern</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #view {
      display: grid;
      gap: 10px;
      width: min(100vw, 840px);
      padding: 12px;
      color: #f7fbff;
      text-shadow: 0 2px 4px #000;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }
    #title {
      overflow: hidden;
      font-size: 20px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #mode {
      flex: none;
      color: #9fdcff;
      font-size: 13px;
      font-weight: 700;
    }
    #sides {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .side {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(165, 222, 255, .72);
      border-radius: 10px;
      background: rgba(4, 15, 27, .82);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .34);
    }
    .side[hidden] { display: none; }
    .label {
      color: #8ed8ff;
      font-size: 13px;
      font-weight: 800;
    }
    .option {
      color: #d9efff;
      font-size: 12px;
      text-align: right;
    }
    .pattern {
      grid-column: 1 / -1;
      overflow: hidden;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1;
      text-align: center;
      text-overflow: clip;
      white-space: nowrap;
    }
    #status {
      color: rgba(230, 244, 255, .75);
      font-size: 13px;
    }
    @media (max-width: 520px) {
      #sides { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main id="view" aria-live="polite">
  <header>
    <div id="title">BMS-IR Arena oraja を待っています</div>
    <div id="mode"></div>
  </header>
  <div id="sides">
    <section class="side" id="side1">
      <div class="label">1P</div>
      <div class="option" id="option1"></div>
      <div class="pattern" id="pattern1">-</div>
    </section>
    <section class="side" id="side2" hidden>
      <div class="label">2P</div>
      <div class="option" id="option2"></div>
      <div class="pattern" id="pattern2">-</div>
    </section>
  </div>
  <div id="status">current.json を待機中</div>
</main>
<script>
  const text = (id, value) => {
    document.getElementById(id).textContent = value == null ? "" : String(value);
  };
  const render = data => {
    if (!data || data.schemaVersion !== 1) return;
    text("title", data.title || "Unknown chart");
    text("mode", `${data.doublePlay ? "DP" : "SP"} / ${data.keyMode || "?"}KEY${data.flip ? " / FLIP" : ""}`);
    text("option1", data.option || "");
    text("pattern1", data.randomPlacement || "-");
    document.getElementById("side2").hidden = !data.doublePlay;
    text("option2", data.option2P || "");
    text("pattern2", data.randomPlacement2P || "-");
    text("status", data.scene === "play" ? "PLAY" : String(data.scene || "").toUpperCase());
  };
  const refresh = async () => {
    try {
      const response = await fetch(`current.json?t=${Date.now()}`, {cache: "no-store"});
      if (response.ok) render(await response.json());
    } catch (_) {
      text("status", "current.json を待機中");
    }
  };
  refresh();
  setInterval(refresh, 500);
</script>
</body>
</html>
