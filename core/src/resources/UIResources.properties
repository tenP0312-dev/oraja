TAB_BMSIR_SPECIFIC=BMS-IR Features
BMSIR_ARENA_LANGUAGE=Client UI language
BMSIR_ARENA_LANGUAGE_DESCRIPTION=Switches the Arena overlay, phase windows, F2 MANIAC OPTIONS, and built-in Ctrl+Shift+F5 windows between Japanese and English. BMS-IR pre-launch settings follow the pre-launch configuration language. Reopen the game to apply it everywhere.
BMSIR_ONE_BASS_ENABLED=Enable original 1-key lane lock with START + one key
BMSIR_ONE_BASS_DESCRIPTION=With standard RANDOM selected, hold START and exactly one playable key while deciding a chart. The original chart's 1-key lane is mapped to that key; the remaining lanes use the same seeded RANDOM placement.
BMSIR_START_HERE_PREVIEW_ENABLED=Show the first notes while loading and during READY
BMSIR_START_HERE_PREVIEW_DESCRIPTION=Shows every note at the chart's first playable timing using the active skin's note images, at the lane top or immediately below SUD+.
BMSIR_DAN_LOCAL_SYNC_ENABLED=Keep BMS-IR Dan courses locally
BMSIR_DAN_LOCAL_SYNC_DESCRIPTION=After a successful Primary IR table fetch, saves BMS-IR class courses for the current player. The last good copy remains available offline; personal course files are never overwritten.
BMSIR_START_BUTTON_ACTION=Music Select START short press
BMSIR_START_BUTTON_ACTION_DESCRIPTION=Choose the START short-press action. Hold for at least 350 ms to open play options. START + a playable key and START + SELECT keep their existing option controls.
BMSIR_SELECT_BUTTON_ACTION=Music Select SELECT short press
BMSIR_SELECT_BUTTON_ACTION_DESCRIPTION=Choose the SELECT short-press action. Hold for at least 350 ms to open assist options. START + SELECT still opens detailed options.
BMSIR_SELECT_DIFFICULTY_DISPLAY=Difficulty display mode
BMSIR_SELECT_DIFFICULTY_DISPLAY_DESCRIPTION=Separate display keeps every chart row and moves the cursor only within the selected song. LR2 style combines each song's charts into one row and applies the selected difficulty stage to every song in the current list.
BMSIR_SELECT_KEY_MODES=Visible and switchable key modes
BMSIR_SELECT_KEY_MODES_DESCRIPTION=Unchecked key modes are hidden throughout Music Select. Checked modes are also used by the short-press cycle in the built-in order, everywhere. ALL adds the combined view to the cycle; ALL by itself preserves all concrete modes. If nothing is checked, 7K is enabled.
BMSIR_HIDE_MISSING_TABLE_SONGS=Hide missing songs in all difficulty tables
BMSIR_HIDE_MISSING_TABLE_SONGS_DESCRIPTION=Applies one shared setting to every difficulty table. Missing songs are hidden even when HTTP downloads are enabled; ordinary folders, searches, and Arena candidate lists are unchanged.
BMSIR_ARENA_TARGET_MODE=Arena target score
BMSIR_ARENA_TARGET_MODE_DESCRIPTION=During Arena play, feeds the selected opponent's live EX score into the main skin target score. The specified player is selected in the in-game overlay for the current match only.
BMSIR_ARENA_GRAPH_ORDER=Arena score graph order
BMSIR_ARENA_GRAPH_ORDER_DESCRIPTION=Rank order follows the current score ranking. Fixed entry order keeps columns and player colors stable for the match.
BMSIR_COVER_CONTROL_MODE=START + key 6/7 behavior
BMSIR_COVER_CONTROL_MODE_DESCRIPTION=Choose standard high-speed control, LR2-style SUD+ control, or extended SUD+/HIDDEN/LIFT control. Cover changes occur once per press.
BMSIR_COVER_CHANGE_STEP=Cover change step (1-1000)
BMSIR_COVER_HISPEED_AUTO_ADJUST_ENABLED=Recalculate FHS after START + 6/7 cover changes
BMSIR_JUDGE_RANK_SORT_ENABLED=Add judge-rank sort to Music Select
BMSIR_JUDGE_RANK_SORT_SKIN_NOTICE_ENABLED=Show an unsupported-skin notice when selecting judge-rank sort
BMSIR_JUDGE_RANK_SORT_DESCRIPTION=Adds judge-rank sort after the eight legacy sort values. Unsupported skins may not display it correctly.
BMSIR_NUMPAD_SHORTCUTS=Physical numeric keypad shortcuts
BMSIR_NUMPAD_SHORTCUTS_DESCRIPTION=Assign an action independently to NUMPAD 0 through 9. Duplicate assignments are allowed. Holding a key does not repeat the action.
BMSIR_NUMPAD_JUDGE_TIMING_STEP=Judge timing change step
BMSIR_JUDGE_TIMING_RESTORE_ENABLED=Restore judge timing after a play that started with AUTO enabled
BMSIR_INFO_NOTIFICATIONS_ENABLED=Show transient INFO notifications
BMSIR_EXPORT_VANILLA_SCORE_DB=Create a score database for standard oraja
BMSIR_EXPORT_VANILLA_SCORE_DB_DESCRIPTION=Creates a new timestamped score-vanilla database containing only normal scores. The original score database is not overwritten, MANIAC scores remain separate, and both databases are checked for integrity.
BMSIR_LONG_NOTE_FIXED=Treat every long note as LONG NOTE (always enabled)
BMSIR_LONG_NOTE_FIXED_DESCRIPTION=BMS-IR does not accept CN/HCN scores. This compatibility rule is fixed so chart note counts and submitted scores stay consistent.
