name: Arena launcher CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Portable validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: arena-launcher/src-tauri

      - name: Test launcher
        working-directory: arena-launcher/src-tauri
        run: cargo test --locked

      - name: Build portable launcher binary
        working-directory: arena-launcher/src-tauri
        run: cargo build --release --locked

      - name: Name Windows portable executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item arena-launcher/src-tauri/target/release/bmsir-arena-launcher.exe "BMS-IR Arena.exe"
          Copy-Item arena-launcher/src-tauri/target/release/bmsir-arena-launcher.exe "BMS-IR Arena Test.exe"

      - name: Upload short-lived Windows portable output
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ci-only-arena-launcher-windows-x64
          path: |
            BMS-IR Arena.exe
            BMS-IR Arena Test.exe
          retention-days: 3
          if-no-files-found: error

# These outputs are deliberately not releases. Official Windows and macOS
# artifact requires the repository's reviewed Authenticode workflow plus a
# compiled release verification key. No installer/MSI is produced.
