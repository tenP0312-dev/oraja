name: Arena oraja CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tools:
    name: Package and compliance tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test release and native-audio validators
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Verify ED and distribution feature parity
        run: python3 tools/check_feature_parity.py --root .

  body:
    name: Body (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86-64
            gradle_args: -Dplatform=windows -Darch=x86-64 -x core:test
            run_tests: false
          - os: macos-14
            platform: macos-aarch64
            gradle_args: -Dplatform=macos -Darch=aarch64
            run_tests: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve body version
        id: body-version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version_source = Path("core/src/bms/player/beatoraja/Version.java").read_text()
          gradle_source = Path("core/build.gradle.kts").read_text()
          java_version = re.search(r'ARENA_CLIENT_VERSION\s*=\s*"([0-9.]+)"', version_source)
          gradle_version = re.search(r'archiveVersion\.set\("([0-9.]+)"\)', gradle_source)
          if not java_version or not gradle_version or java_version.group(1) != gradle_version.group(1):
              raise SystemExit("Arena client and Gradle archive versions do not match")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={java_version.group(1)}\n")

      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx
          cache: gradle

      - name: Run the full body test suite
        if: matrix.run_tests
        shell: bash
        run: ./gradlew core:test ${{ matrix.gradle_args }}

      - name: Build and verify the platform body
        shell: bash
        run: ./gradlew core:shadowJar ${{ matrix.gradle_args }}

      - name: Upload reviewed body candidate
        uses: actions/upload-artifact@v4
        with:
          name: arena-oraja-${{ matrix.platform }}
          path: dist/BMS-IR-Arena-oraja-${{ steps.body-version.outputs.version }}-${{ matrix.platform }}.jar
          retention-days: 3
          if-no-files-found: error

  native-audio:
    name: Reproducible Windows native audio
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build twice from verified sources
        shell: pwsh
        run: >-
          ./native-audio/build-native-audio.ps1
          -OutputDirectory '${{ runner.temp }}/native-audio-bundle'
          -VerifyReproducible

      - name: Verify source, license, PE architecture, exports, and SBOM
        run: python tools/verify_native_audio_bundle.py '${{ runner.temp }}/native-audio-bundle'

      - name: Upload exact native-audio candidate
        uses: actions/upload-artifact@v4
        with:
          name: arena-oraja-windows-x86-64-native-audio
          path: ${{ runner.temp }}/native-audio-bundle
          retention-days: 3
          if-no-files-found: error
